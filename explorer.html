<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des projets — Maëlys Badger</title>
<meta name="description" content="Explore les projets de Maëlys Badger sur une carte jouable en pixel art.">
<link rel="stylesheet" href="style.css">
<script src="js/projets.js" defer></script>
<style>
/* Avatar styles from the portfolio map */
.map:focus-visible {outline:2px solid var(--mint);outline-offset:3px}
.map-avatar {
  position:absolute;z-index:3;left:var(--player-x,9%);top:var(--player-y,85%);
  width:30px;height:35px;padding-bottom:2px;transform:translate(-50%,-85%);
  display:grid;place-items:center;pointer-events:none;
  filter:drop-shadow(0 2px 1px #160e1a);
}
.map-avatar[hidden],.map-start[hidden],.map-guide[hidden] {display:none}
.map-avatar::before {
  content:"";position:absolute;bottom:2px;width:28px;height:9px;
  border-radius:50%;background:#251931;border:1px solid #ffc77d;
}
.map-avatar canvas {
  position:relative;width:24px;height:28px;image-rendering:pixelated;
  margin-bottom:6px;transform:scaleX(var(--facing,1));
}
.map .pin.is-near {
  color:#252038;background:var(--mint);border-color:#effae6;
  box-shadow:0 0 0 4px #201b34ae,0 0 14px #91e4cc;
}
.map .pin.is-near .pin-label {color:var(--mint)}
.map-guide {
  border-top:1px solid var(--line);margin-top:6px;padding:8px 10px 4px;
  color:var(--muted);font-size:.75rem;line-height:1.45;
}
.map-guide kbd {font:700 .75rem var(--mono);color:var(--gold)}
.map-status:not(:empty) {display:block;color:var(--mint);margin-top:3px;font-weight:650}
.explorer {
  height:100svh;min-height:475px;display:grid;grid-template-rows:auto minmax(320px,1fr) auto;
  gap:10px;padding:10px 14px;min-width:0;
}
.explorer-bar,.explorer-footer {
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.explorer-bar h1 {
  margin:0;font:700 clamp(.9rem,2.7vw,1.45rem)/1.2 var(--mono);
  letter-spacing:0;color:var(--gold);text-align:center;
}
.back-link,.map-start {
  color:var(--gold);background:#312638;border:1px solid #8f6859;
  border-radius:4px;padding:7px 10px;font:700 .75rem var(--mono);cursor:pointer;
}
.back-link:hover,.map-start:hover {background:#4a3544}
.explorer .map {
  width:100%;min-height:0;aspect-ratio:auto;overflow:hidden;border-radius:8px;
}
.explorer .map > img {object-position:center;filter:brightness(.87) saturate(1.1)}
.explorer .pin {z-index:2}
.explorer .pin:focus-visible {z-index:5}
.explorer .pin.is-near {z-index:4}
.explorer .map-avatar {z-index:6}
.explorer .map-guide {border:0;margin:0;padding:0}
.explorer .map-status:not(:empty) {display:block;margin:0}
.explorer-actions {display:flex;align-items:center;gap:8px}
.explorer-details {display:grid;gap:4px}
.discovery-total {
  color:var(--gold);font:700 .76rem var(--mono);white-space:nowrap;
}
.secret {
  position:absolute;z-index:1;left:var(--x);top:var(--y);width:32px;height:32px;
  transform:translate(-50%,-50%);display:grid;place-items:center;
  background:transparent;border:0;padding:0;cursor:pointer;
}
.secret::before {
  content:"";width:13px;height:13px;background:#ffe299;
  clip-path:polygon(50% 0,61% 37%,100% 50%,61% 63%,50% 100%,39% 63%,0 50%,39% 37%);
}
.secret:hover,.secret:focus-visible {filter:drop-shadow(0 0 5px #ffcc68)}
.secret[hidden] {display:none}
@media(max-width:620px) {
  .explorer {padding:8px;gap:8px}
  .explorer-bar,.explorer-footer {flex-wrap:wrap}
  .explorer-footer {gap:6px 10px}
  .explorer .pin {width:32px;height:34px}
  .explorer .pin-label {font-size:.64rem}
  .explorer .route {display:none}
}
@media(prefers-reduced-motion:reduce) {
  .secret,.map-avatar {animation:none}
}
.landmark {
  position:absolute;z-index:3;left:var(--hot-x);top:var(--hot-y);
  transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
  border:1px solid #c89b72;border-radius:5px;padding:6px 9px;
  color:#ffdfa7;background:#261c32ed;cursor:pointer;
  font:700 .74rem var(--mono);
}
.landmark:hover,.landmark.is-near,.landmark:focus-visible {
  color:#211c32;background:var(--mint);border-color:#e1ffed
}
.landmark-icon {width:15px;height:11px;display:inline-block;border:2px solid currentColor;border-radius:2px;position:relative}
.landmark-icon::after {content:"";position:absolute;display:block}
.train-icon::after {inset:1px 2px 3px;border-inline:2px solid currentColor}
.case-icon::after {top:-5px;left:3px;width:5px;height:4px;border:1px solid currentColor;border-bottom:0}
.discovery-panel {
  position:absolute;z-index:7;left:clamp(8px,2vw,24px);top:clamp(8px,2vw,24px);
  width:min(365px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;
  padding:13px;border-radius:9px;border:1px solid #b08672;background:#211a31f5;
  box-shadow:0 12px 30px #100e1caa;color:var(--ink);
}
.discovery-panel[hidden] {display:none}
.discovery-head {display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.discovery-head h2 {margin:0;color:var(--gold);font:700 .92rem var(--mono);letter-spacing:0}
.discovery-close {border:1px solid var(--line);border-radius:4px;background:#352943;color:#fff1da;font:700 .96rem var(--mono);width:30px;height:30px;cursor:pointer}
.discovery-items {list-style:none;margin:0;padding:0;display:grid;gap:8px}
.discovery-item {display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px;min-height:65px}
.discovery-item p {font-size:.84rem;line-height:1.4}
.collectible-art {
  display:block;aspect-ratio:1;border-radius:5px;border:1px solid #86647e;
  background:#30233b url('souvenirs.webp') no-repeat var(--art-x) center / 300% 100%;
}
.discovery-empty {font-size:.84rem;line-height:1.5;color:var(--muted)}
.map-avatar.is-riding canvas {visibility:hidden}
.map-avatar.is-riding::before {width:31px;height:14px;border:2px solid #ffe6a3;border-radius:3px;background:#b35d5f;box-shadow:0 3px 0 1px #34243d}
.map-avatar.is-riding::after {content:"";position:absolute;width:5px;height:5px;bottom:7px;left:6px;background:#ffe8ad;box-shadow:7px 0 #ffe8ad,14px 0 #ffe8ad}
@media(max-width:620px) {
  .landmark {padding:5px 7px;font-size:.65rem}
  .discovery-item {grid-template-columns:57px 1fr}
}
</style>
</head>
<body>
<main class="explorer">
  <header class="explorer-bar">
    <a class="back-link" href="index.html" data-en="Back to the portfolio">Retour au portfolio</a>
    <h1 id="map-title" data-en="Project map">Carte des projets</h1>
    <div class="explorer-actions">
      <button class="map-start" type="button" data-en="Focus map" hidden>Activer la carte</button>
      <button class="language" type="button" aria-label="Switch to English">EN</button>
    </div>
  </header>
      <div class="map" id="project-map" role="group" aria-labelledby="map-title" aria-describedby="map-guide">
        <img src="image/atlas.webp" alt="" width="1536" height="1024" fetchpriority="high">
        <div class="route" aria-hidden="true"><i></i><i></i><i></i></div>
        <a class="pin pin-one" href="index.html#librairie" data-project-pin="librairie"><span class="pin-number" aria-hidden="true">01</span><span class="pin-label" data-en="Online bookstore">Librairie en ligne</span></a>
        <a class="pin pin-two" href="index.html#calculatrice" data-project-pin="calculatrice"><span class="pin-number" aria-hidden="true">02</span><span class="pin-label" data-en="Web calculator">Calculatrice web</span></a>
        <a class="pin pin-three" href="index.html#aura" data-project-pin="aura"><span class="pin-number" aria-hidden="true">03</span><span class="pin-label">Aura Perfumes</span></a>
        <a class="pin pin-four" href="index.html#overengineered" data-project-pin="overengineered"><span class="pin-number" aria-hidden="true">04</span><span class="pin-label">OverEngineered</span></a>
        <button class="secret" type="button" data-art="0" style="--x:27%;--y:29%" aria-label="Découvrir un secret" data-fr="Tu as trouvé la carte postale de Séoul, souvenir de mon semestre à SeoulTech." data-message-en="You found the Seoul postcard, a souvenir from my semester at SeoulTech." hidden></button>
        <button class="secret" type="button" data-art="1" style="--x:55%;--y:85%" aria-label="Découvrir un secret" data-fr="Tu as trouvé le billet de train griffonné. Au dos, quelqu’un a écrit « git commit -m voyage »." data-message-en="You found the scribbled train ticket. On the back, someone wrote “git commit -m voyage”." hidden></button>
        <button class="secret" type="button" data-art="2" style="--x:74%;--y:20%" aria-label="Découvrir un secret" data-fr="Tu as trouvé la sauvegarde secrète. Le prochain niveau s’appelle « Avril 2027 »." data-message-en="You found the secret save point. The next level is called “April 2027”." hidden></button>
        <button class="landmark" type="button" data-landmark="train" data-world-x=".894" data-world-y=".588" style="--hot-x:89%;--hot-y:59%">
          <span class="landmark-icon train-icon" aria-hidden="true"></span><span data-en="Train">Train</span>
        </button>
        <button class="landmark" type="button" data-landmark="case" data-world-x=".371" data-world-y=".728" style="--hot-x:37%;--hot-y:73%">
          <span class="landmark-icon case-icon" aria-hidden="true"></span><span data-en="Suitcase">Valise</span>
        </button>
        <aside class="discovery-panel" aria-labelledby="discovery-title" hidden>
          <div class="discovery-head">
            <h2 id="discovery-title"></h2>
            <button class="discovery-close" type="button" aria-label="Fermer">×</button>
          </div>
          <ul class="discovery-items"></ul>
        </aside>
        <span class="map-avatar" aria-hidden="true" hidden><canvas width="12" height="14"></canvas></span>
      </div>
  <footer class="explorer-footer">
    <div class="explorer-details">
      <p class="map-guide" id="map-guide" data-en="Arrow keys or WASD to move. Enter opens a nearby project. You can also tap the map.">Flèches ou ZQSD pour avancer. Entrée ouvre un projet à proximité. Tu peux aussi toucher la carte.</p>
      <p class="map-status" role="status"></p>
    </div>
    <p class="discovery-total"><span data-en="Secrets">Secrets</span> <span class="discovery-count">0 / 3</span></p>
  </footer>
</main>
<script>
{
  const map = document.querySelector('#project-map');
  const start = document.querySelector('.map-start');
  const status = document.querySelector('.map-status');
  const avatar = map.querySelector('.map-avatar');
  const canvas = avatar.querySelector('canvas');
  const pins = [...map.querySelectorAll('[data-project-pin]')];
  const secrets = [...map.querySelectorAll('.secret')];
  const count = document.querySelector('.discovery-count');
  const artwork = map.querySelector('img');
  const landmarks = [...map.querySelectorAll('[data-landmark]')];
  const panel = map.querySelector('.discovery-panel');
  const panelTitle = panel.querySelector('h2');
  const panelItems = panel.querySelector('.discovery-items');
  const closePanel = panel.querySelector('.discovery-close');
  const found = new Set();
  const artworkTitles = [
    ['Carte postale de Séoul', 'Seoul postcard'],
    ['Billet de train', 'Train ticket'],
    ['Disquette de sauvegarde', 'Save disk'],
  ];
  let panelMode = null;
  let riding = false;
  let trainMessage = null;
  const language = document.querySelector('.language');
  const labels = [...document.querySelectorAll('[data-en]')];
  const french = labels.map(label => label.textContent);
  let lastSecret = null;

  function setLanguage(lang) {
    const english = lang === 'en';
    document.documentElement.lang = lang;
    document.title = english ? 'Project map — Maëlys Badger' : 'Carte des projets — Maëlys Badger';
    language.textContent = english ? 'FR' : 'EN';
    language.setAttribute('aria-label', english ? 'Afficher en français' : 'Switch to English');
    labels.forEach((label, i) => label.textContent = english ? label.dataset.en : french[i]);
    secrets.forEach(secret => secret.setAttribute('aria-label', english ? 'Discover a secret' : 'Découvrir un secret'));
    closePanel.setAttribute('aria-label', english ? 'Close' : 'Fermer');
    updatePanel();
    updateStatus();
  }

  const frame = [
    '....HHHH....',
    '...HHHHHH...',
    '...SSSSSEA..',
    '....SESSSA..',
    '....SSSSS...',
    '...JJQQJ....',
    '..BJJQQJJ...',
    '..BJJJJJJS..',
    '..BBJJJJ....',
    '....TTTT....',
    '....T..T....',
    '....T..T....',
    '...WW..WW...',
    '............',
  ];
  const colors = {H:'#3b2140',S:'#ffd0a0',E:'#3b2140',A:'#b96c56',J:'#60bea9',Q:'#ffe184',B:'#d58b53',T:'#4b3a72',W:'#fff2db'};
  const context = canvas.getContext('2d');
  frame.forEach((row, y) => [...row].forEach((pixel, x) => {
    if (pixel === '.') return;
    context.fillStyle = colors[pixel];
    context.fillRect(x, y, 1, 1);
  }));

  const bindings = new Map([
    ['ArrowLeft',[-1,0]],['q',[-1,0]],['a',[-1,0]],
    ['ArrowRight',[1,0]],['d',[1,0]],
    ['ArrowUp',[0,-1]],['z',[0,-1]],['w',[0,-1]],
    ['ArrowDown',[0,1]],['s',[0,1]],
  ]);
  const held = new Map();
  const position = {x:0.09,y:0.85};
  let near = null;
  let previous = 0;
  let animationId = 0;

  function updateStatus() {
    const english = document.documentElement.lang === 'en';
    let message = '';
    if (trainMessage) {
      message = trainMessage[Number(english)];
    } else if (near) {
      if (near.dataset.landmark === 'train') message = english ? 'Train · Enter to board' : 'Train · Entrée pour monter';
      else if (near.dataset.landmark === 'case') message = english ? 'Suitcase · Enter to open it' : 'Valise · Entrée pour l’ouvrir';
      else {
        const name = near.querySelector('.pin-label').textContent;
        message = english ? `Next stop: ${name} · Press Enter to open` : `Étape : ${name} · Appuie sur Entrée pour ouvrir`;
      }
    }
    if (status.textContent !== message) status.textContent = message;
  }

  function updatePanel() {
    if (!panelMode) return;
    const english = document.documentElement.lang === 'en';
    const isCase = panelMode === 'case';
    panelTitle.textContent = isCase ? (english ? 'Travel suitcase' : 'Valise de voyage')
      : (english ? 'Secret discovered' : 'Secret découvert');
    panelItems.replaceChildren();
    const items = isCase ? found : [lastSecret];
    if (isCase && found.size === 0) {
      const empty = document.createElement('li');
      empty.className = 'discovery-empty';
      empty.textContent = english ? 'Your discoveries will appear here as you explore.'
        : 'Tes découvertes apparaîtront ici au fil de ton exploration.';
      panelItems.append(empty);
    }
    for (const secret of items) {
      const item = document.createElement('li');
      item.className = 'discovery-item';
      const picture = document.createElement('span');
      const art = Number(secret.dataset.art);
      picture.className = 'collectible-art';
      picture.style.setProperty('--art-x', `${art * 50}%`);
      picture.setAttribute('role', 'img');
      picture.setAttribute('aria-label', artworkTitles[art][Number(english)]);
      const description = document.createElement('p');
      description.textContent = english ? secret.dataset.messageEn : secret.dataset.fr;
      item.append(picture, description);
      panelItems.append(item);
    }
    panel.hidden = false;
  }

  function dismissPanel() {
    panelMode = null;
    panel.hidden = true;
    map.focus({preventScroll:true});
  }

  function alignLandmarks() {
    const width = map.clientWidth;
    const height = map.clientHeight;
    const pictureWidth = artwork.naturalWidth || 1536;
    const pictureHeight = artwork.naturalHeight || 1024;
    const scale = Math.max(width / pictureWidth, height / pictureHeight);
    for (const landmark of landmarks) {
      const x = width / 2 + (Number(landmark.dataset.worldX) - .5) * pictureWidth * scale;
      const y = height / 2 + (Number(landmark.dataset.worldY) - .5) * pictureHeight * scale;
      landmark.style.setProperty('--hot-x', `${Math.max(37, Math.min(width - 37, x))}px`);
      landmark.style.setProperty('--hot-y', `${Math.max(28, Math.min(height - 28, y))}px`);
    }
    render();
  }

  function boardTrain() {
    if (riding) return;
    stop();
    dismissPanel();
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const first = landmarks.find(landmark => landmark.dataset.landmark === 'train');
    const x = parseFloat(first.style.getPropertyValue('--hot-x')) / map.clientWidth;
    const y = parseFloat(first.style.getPropertyValue('--hot-y')) / map.clientHeight;
    const destination = landmarks.find(landmark => landmark.dataset.landmark === 'case');
    const arrivalX = (parseFloat(destination.style.getPropertyValue('--hot-x')) - 18) / map.clientWidth;
    const arrivalY = (parseFloat(destination.style.getPropertyValue('--hot-y')) + 18) / map.clientHeight;
    riding = true;
    trainMessage = ['Prochain arrêt : la gare du lac !', 'Next stop: Lakeside Station!'];
    avatar.classList.add('is-riding');
    positionAt(x, y);
    updateStatus();
    const started = performance.now();
    function ride(time) {
      const progress = reducedMotion ? 1 : Math.min(1,(time - started) / 1650);
      const eased = progress * progress * (3 - 2 * progress);
      positionAt(x + (arrivalX - x) * eased, y + (arrivalY - y) * eased - .13 * Math.sin(Math.PI * eased));
      if (progress < 1) {
        requestAnimationFrame(ride);
        return;
      }
      riding = false;
      avatar.classList.remove('is-riding');
      trainMessage = ['Arrivée à la gare du lac.', 'Arrived at Lakeside Station.'];
      updateStatus();
    }
    requestAnimationFrame(ride);
  }

  function render() {
    const bounds = map.getBoundingClientRect();
    const x = position.x * map.clientWidth;
    const y = position.y * map.clientHeight;
    avatar.style.setProperty('--player-x', `${position.x * 100}%`);
    avatar.style.setProperty('--player-y', `${position.y * 100}%`);
    const distanceTo = (target) => {
      const marker = target.getBoundingClientRect();
      const dx = marker.left + marker.width / 2 - bounds.left - map.clientLeft - x;
      const dy = marker.top + marker.height / 2 - bounds.top - map.clientTop - y;
      return Math.hypot(dx, dy);
    };
    for (const secret of secrets) {
      if (!riding && !secret.hidden && distanceTo(secret) < 24) reveal(secret);
    }
    let closest = null;
    let distance = 37;
    for (const pin of [...pins, ...landmarks]) {
      const candidate = distanceTo(pin);
      if (candidate >= distance) continue;
      distance = candidate;
      closest = pin;
    }
    if (closest === near) return;
    near?.classList.remove('is-near');
    near = closest;
    near?.classList.add('is-near');
    updateStatus();
  }

  function reveal(secret) {
    if (secret.hidden) return;
    secret.hidden = true;
    lastSecret = secret;
    found.add(secret);
    count.textContent = `${found.size} / ${secrets.length}`;
    panelMode = 'secret';
    updatePanel();
  }

  function positionAt(x, y) {
    const width = map.clientWidth;
    const height = map.clientHeight;
    position.x = Math.max(16 / width, Math.min(1 - 16 / width, x));
    position.y = Math.max(30 / height, Math.min(1 - 8 / height, y));
    render();
  }

  function move(dx, dy, pixels) {
    const length = Math.hypot(dx, dy);
    if (!length) return;
    const width = map.clientWidth;
    const height = map.clientHeight;
    if (dx) avatar.style.setProperty('--facing', dx > 0 ? '1' : '-1');
    positionAt(position.x + dx * pixels / (length * width), position.y + dy * pixels / (length * height));
  }

  function tick(time) {
    let dx = 0;
    let dy = 0;
    for (const [x,y] of held.values()) {
      dx += x;
      dy += y;
    }
    move(Math.sign(dx), Math.sign(dy), Math.min(time - previous, 36) * Math.max(.15, map.clientWidth * .00023));
    previous = time;
    animationId = requestAnimationFrame(tick);
  }

  function stop() {
    held.clear();
    cancelAnimationFrame(animationId);
    animationId = 0;
  }

  avatar.hidden = false;
  start.hidden = false;
  map.tabIndex = 0;
  start.addEventListener('click', () => map.focus());
  map.addEventListener('focus', render);
  for (const secret of secrets) {
    secret.hidden = false;
    secret.addEventListener('click', () => {
      reveal(secret);
      map.focus({preventScroll:true});
    });
  }
  closePanel.addEventListener('click', dismissPanel);
  for (const landmark of landmarks) {
    landmark.addEventListener('click', () => {
      if (riding) return;
      if (landmark.dataset.landmark === 'train') boardTrain();
      else {
        trainMessage = null;
        panelMode = 'case';
        updatePanel();
        updateStatus();
        closePanel.focus();
      }
    });
  }
  map.addEventListener('click', (event) => {
    if (riding || event.target.closest('a,button,.discovery-panel')) return;
    trainMessage = null;
    const box = map.getBoundingClientRect();
    positionAt((event.clientX - box.left - map.clientLeft) / map.clientWidth,
      (event.clientY - box.top - map.clientTop) / map.clientHeight);
    map.focus({preventScroll:true});
    updateStatus();
  });
  map.addEventListener('blur', stop);
  map.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !panel.hidden) {
      dismissPanel();
      return;
    }
    if (riding || event.target !== map || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key === 'Escape') {
      start.focus();
      return;
    }
    if (event.key === 'Enter' && near) {
      event.preventDefault();
      if (!event.repeat) near.click();
      return;
    }
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    const direction = bindings.get(key);
    if (!direction) return;
    event.preventDefault();
    if (held.has(key)) return;
    held.set(key, direction);
    trainMessage = null;
    move(...direction, 7);
    updateStatus();
    if (!animationId) {
      previous = performance.now();
      animationId = requestAnimationFrame(tick);
    }
  });
  map.addEventListener('keyup', (event) => {
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    held.delete(key);
    if (!held.size) stop();
  });
  window.addEventListener('blur', stop);
  new ResizeObserver(alignLandmarks).observe(map);
  artwork.addEventListener('load', alignLandmarks);
  alignLandmarks();
  const url = new URL(location.href);
  setLanguage(url.searchParams.get('lang') === 'en' ? 'en' : 'fr');
  language.addEventListener('click', () => setLanguage(document.documentElement.lang === 'en' ? 'fr' : 'en'));
  map.focus({preventScroll:true});
  document.addEventListener('DOMContentLoaded', () => {
    for (const pin of pins) {
      const link = projectRepositories[pin.dataset.projectPin]?.trim();
      if (link && /^https:\/\/github\.com\/[\w-]+\/[\w.-]+\/?$/i.test(link)) pin.href = link;
    }
  });
}
</script>
</body>
